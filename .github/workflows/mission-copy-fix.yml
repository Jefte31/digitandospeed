name: Corrigir linguagem de missão

on:
  push:
    paths:
      - '.github/workflows/mission-copy-fix.yml'

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir textos
        shell: python
        run: |
          from pathlib import Path
          fixes = {
            'index.html': [('treino de digitação, treino de digitação', 'treino de digitação, prática de digitação')],
            'fr.html': [('Zone du mission de dactylographie', 'Zone de la mission de dactylographie')],
            'es.html': [('Área del misión de mecanografía', 'Área de la misión de mecanografía')],
          }
          for filename, pairs in fixes.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'prática de digitação' index.html
          grep -q 'Zone de la mission' fr.html
          grep -q 'Área de la misión' es.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fr.html es.html
          git commit -m "Corrige textos finais de missão" || exit 0
          git push
