name: Ajustar prioridade de alvos

on:
  push:
    paths:
      - '.github/workflows/target-priority-fix.yml'

permissions:
  contents: write

jobs:
  fix-target-priority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Priorizar o alvo mais próximo da base
        shell: python
        run: |
          from pathlib import Path

          game = Path('game.js')
          text = game.read_text(encoding='utf-8')
          old = '''      const candidates = enemies
                .filter((e) => wordInitial(e.word) === key)
                .sort((a, b) => {
                  const priority = (e) => e.kind === "boss" ? 3 : (e.kind === "bonus" ? 2 : 1);
                  return priority(b) - priority(a) || b.y - a.y;
                });'''
          new = '''      const candidates = enemies
                .filter((e) => wordInitial(e.word) === key)
                .sort((a, b) => b.y - a.y);'''
          if text.count(old) != 1:
              raise SystemExit(f'game.js: trecho esperado encontrado {text.count(old)} vez(es)')
          game.write_text(text.replace(old, new), encoding='utf-8')

          numpad = Path('numpad.js')
          text = numpad.read_text(encoding='utf-8')
          old = 'en.filter(e=>e.word[0]===k).sort((a,b)=>(b.kind==="boss"?3:b.kind==="bonus"?2:1)-(a.kind==="boss"?3:a.kind==="bonus"?2:1)||b.y-a.y)'
          new = 'en.filter(e=>e.word[0]===k).sort((a,b)=>b.y-a.y)'
          if text.count(old) != 1:
              raise SystemExit(f'numpad.js: trecho esperado encontrado {text.count(old)} vez(es)')
          numpad.write_text(text.replace(old, new), encoding='utf-8')

      - name: Validar JavaScript
        run: |
          node --check game.js
          node --check numpad.js

      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js numpad.js
          git commit -m "Prioriza alvo mais próximo da base"
          git push
